<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Four bars of differing length: one per carrier, ranked. The mark has to
       read at 16px in a browser tab, so it carries no text and no fine detail.
       Colours are the app's own tier ramp from VerdictCard.tsx, best at top. -->
  <rect width="32" height="32" rx="7" fill="#0f172a" />
  <rect x="7" y="8"  width="18" height="3.5" rx="1.75" fill="#34d399" />
  <rect x="7" y="14" width="13" height="3.5" rx="1.75" fill="#38bdf8" />
  <rect x="7" y="20" width="15" height="3.5" rx="1.75" fill="#e2e8f0" />
</svg>
