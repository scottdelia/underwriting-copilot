<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Three bars of differing length: carriers, ranked. The mark has to read at
       16px in a browser tab, so it carries no text and no fine detail.

       Colours are hard-coded because an SVG loaded as a favicon gets no page
       stylesheet, so it cannot reference the design tokens. They must be kept
       in step with `:root` in src/index.css and with the Mark() component in
       App.tsx by hand: brand teal ground, action yellow, white. This file was
       still on a palette two revisions old because nothing links the two. -->
  <rect width="32" height="32" rx="7" fill="#005851" />
  <rect x="7" y="8"  width="18" height="3.5" rx="1.75" fill="#ffcc00" />
  <rect x="7" y="14" width="13" height="3.5" rx="1.75" fill="#ffffff" fill-opacity="0.92" />
  <rect x="7" y="20" width="15" height="3.5" rx="1.75" fill="#ffffff" fill-opacity="0.55" />
</svg>
